services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: humanities
      POSTGRES_USER: humanities
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U humanities -d humanities]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: humanities
      POSTGRES_USER: humanities
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DJANGO_DEBUG: '0'
      TRUST_HTTPS_PROXY: '1'
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
