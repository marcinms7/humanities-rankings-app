services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: humanities
      POSTGRES_USER: humanities
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humanities -d humanities"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only-change-before-deployment}
      POSTGRES_HOST: db
      POSTGRES_DB: humanities
      POSTGRES_USER: humanities
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
